server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # Snapshot build (commit-pinned). Stable 1.18.1's local cipher can't parse
    # current YT player scripts; deciphering is offloaded to remoteCipher below.
    - dependency: "dev.lavalink.youtube:youtube-plugin:9d4dbeeb51f16d53078486d69d27654d4acfa7fb"
      snapshot: true
  server:
    # Resolved from the container environment; boot fails if unset.
    password: "${LAVALINK_SERVER_PASSWORD}"
    sources:
      # Built-in lavaplayer YouTube is replaced by the youtube-source plugin.
      youtube: false
      # YouTube parity only (lavalink-plan.md scope); everything else off.
      bandcamp: false
      soundcloud: false
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Datacenter IP is flagged by YouTube; authenticate the node via OAuth.
    # Token minted once via the device flow, injected from the container env
    # (YOUTUBE_REFRESH_TOKEN, sourced from gitignored .env — never committed).
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN}"
      skipInitialization: true
    # TV (TVHTML5) is the only OAuth-compatible client — it carries the token
    # that bypasses the datacenter-IP "This video requires login" block.
    clients:
      - MUSIC
      - TV
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    # YouTube rotates player scripts faster than the plugin's local cipher can
    # track. Offload signature deciphering to the yt-cipher sidecar (compose);
    # it executes the player JS, so it survives player changes without bumps.
    remoteCipher:
      url: "http://yt-cipher:8001"
      password: "${YT_CIPHER_TOKEN}"

logging:
  level:
    root: INFO
    lavalink: INFO
