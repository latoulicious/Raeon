version: '3.8'

services:
  raeon-bot:
    build: .
    container_name: raeon-discord-bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - raeon-network
    volumes:
      # Mount cookies file if needed for yt-dlp
      - ./cookies.txt:/app/cookies.txt:ro
    healthcheck:
      test: ["CMD", "node", "dist/main.js", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: raeon-lavalink
    restart: unless-stopped
    environment:
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    ports:
      # Host-local only; the bot runs on the host until L5 moves it into compose
      - "127.0.0.1:2333:2333"
    networks:
      - raeon-network
    healthcheck:
      # $$ escapes compose interpolation; resolved inside the container
      test: ["CMD-SHELL", "curl -sf -H \"Authorization: $${LAVALINK_SERVER_PASSWORD}\" http://localhost:2333/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: raeon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: raeon
      POSTGRES_USER: raeon
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - raeon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raeon"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: Redis for caching (if needed in future)
  # redis:
  #   image: redis:7-alpine
  #   container_name: raeon-redis
  #   restart: unless-stopped
  #   networks:
  #     - raeon-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3

networks:
  raeon-network:
    driver: bridge

volumes:
  postgres_data:
