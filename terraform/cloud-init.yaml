#cloud-config
# Bootstraps Docker Engine + Compose plugin and (optionally) clones the repo.
# Does NOT start the stack or write secrets — you do that over SSH.
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git

write_files:
  # Cap container log growth so a noisy bot can't fill the boot volume.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

runcmd:
  # --- Docker Engine from the official Docker apt repo (arm64) ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  # --- App dir + optional clone ---
  - mkdir -p /opt/raeon && chown ubuntu:ubuntu /opt/raeon
  - if [ -n "${repo_url}" ]; then sudo -u ubuntu git clone ${repo_url} /opt/raeon; else echo "no repo_url set; copy code into /opt/raeon manually" > /opt/raeon/README-FIRST.txt; chown ubuntu:ubuntu /opt/raeon/README-FIRST.txt; fi
  - touch /opt/raeon/.cloud-init-done
