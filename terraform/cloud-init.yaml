#cloud-config
# Bootstraps Docker Engine + Compose plugin and (optionally) clones the repo.
# Does NOT start the stack or write secrets — you do that over SSH.
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git

write_files:
  # Cap container log growth so a noisy bot can't fill the boot volume.
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

runcmd:
  # --- 4 GB swap: cushions the 1 GB E2.1.Micro for the JVM + the npm build ---
  - fallocate -l 4G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=4096
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl -w vm.swappiness=10
  - echo 'vm.swappiness=10' > /etc/sysctl.d/99-raeon.conf
  # --- Docker Engine from the official Docker apt repo (arch auto-detected) ---
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  # --- App dir + optional clone ---
  - mkdir -p /opt/raeon && chown ubuntu:ubuntu /opt/raeon
  - if [ -n "${repo_url}" ]; then sudo -u ubuntu git clone ${repo_url} /opt/raeon; else echo "no repo_url set; copy code into /opt/raeon manually" > /opt/raeon/README-FIRST.txt; chown ubuntu:ubuntu /opt/raeon/README-FIRST.txt; fi
  - touch /opt/raeon/.cloud-init-done
