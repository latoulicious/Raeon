#cloud-config
# Paste-ready cloud-init for MANUAL OCI Console instance creation.
# (The Terraform cloud-init.yaml uses a ${repo_url} placeholder that the
# console won't expand — this copy hardcodes the public repo URL.)
# Installs Docker + Compose + 4 GB swap and clones the repo. Does NOT start
# the stack or write secrets — do that over SSH afterward.
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git

write_files:
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }

runcmd:
  - fallocate -l 4G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=4096
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl -w vm.swappiness=10
  - echo 'vm.swappiness=10' > /etc/sysctl.d/99-raeon.conf
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  - mkdir -p /opt/raeon && chown ubuntu:ubuntu /opt/raeon
  - sudo -u ubuntu git clone https://github.com/latoulicious/Raeon.git /opt/raeon
  - touch /opt/raeon/.cloud-init-done
